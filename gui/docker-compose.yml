version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: py3plex-gui-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: gui/Dockerfile.api
      args:
        - PY3PLEX_PATH=/workspace
    container_name: py3plex-gui-api
    environment:
      - REDIS_URL=redis://redis:6379/0
      - API_WORKERS=${API_WORKERS:-2}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-512}
      - DATA_DIR=/data
    volumes:
      - ./data:/data
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ..
      dockerfile: gui/worker/Dockerfile
      args:
        - PY3PLEX_PATH=/workspace
    container_name: py3plex-gui-worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-2}
      - DATA_DIR=/data
    volumes:
      - ./data:/data
      - ./api:/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker -Q default -O fair --concurrency=${CELERY_CONCURRENCY:-2} --loglevel=info

  flower:
    build:
      context: ..
      dockerfile: gui/worker/Dockerfile
      args:
        - PY3PLEX_PATH=/workspace
    container_name: py3plex-gui-flower
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/data
      - ./api:/app
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app flower --port=5555

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: py3plex-gui-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080/api
    command: npm run dev -- --host 0.0.0.0

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: py3plex-gui-nginx
    ports:
      - "8080:80"
    depends_on:
      - api
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  redis-data:

networks:
  default:
    name: py3plex-gui-network
