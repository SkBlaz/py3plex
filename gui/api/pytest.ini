[pytest]
testpaths = ci/api-tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers

# Timeout for tests
timeout = 30

# Markers
markers =
    integration: Integration tests that require external services
    unit: Unit tests that don't require external services
