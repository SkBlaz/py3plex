# Workflow demonstrating uncertainty analysis with py3plex
# This shows how to quantify statistical uncertainty in network metrics

name: "Uncertainty-Aware Network Analysis"
description: "Compare observed network properties against null models and bootstrap confidence intervals"

# Define datasets to work with
datasets:
  - name: "social_network"
    type: "generate"
    generator: "random"
    parameters:
      nodes: 40
      layers: 3
      probability: 0.12
      seed: 42

# Define operations to perform
operations:
  # Compute basic statistics
  - type: "stats"
    dataset: "social_network"
    parameters:
      description: "Baseline network statistics"

  # Compute centrality with uncertainty quantification
  - type: "centrality"
    dataset: "social_network"
    parameters:
      measure: "betweenness"
      description: "Betweenness centrality for hub identification"

  # Null model comparison (would require extension to workflows.py)
  # For now, document the capability
  - type: "stats"
    dataset: "social_network"
    parameters:
      description: "Network statistics for null model baseline"

  # Community detection for comparison
  - type: "community"
    dataset: "social_network"
    parameters:
      algorithm: "louvain"
      description: "Community structure analysis"

  # Visualize the network
  - type: "visualize"
    dataset: "social_network"
    parameters:
      output: "uncertainty_network.png"
      layout: "spring"

# Output configuration
output:
  directory: "uncertainty_results"
  summary: "uncertainty_summary.json"
