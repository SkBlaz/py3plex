name: Repository size

on:
  pull_request:

jobs:
  check-new-blobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check newly introduced Git objects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_new_blob_sizes.py "$BASE_SHA" "$HEAD_SHA"
