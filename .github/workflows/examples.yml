name: Examples CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  # Allow manual trigger
  workflow_dispatch:

jobs:
  run-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    # Limit permissions for security
    permissions:
      contents: read
      actions: read
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      timeout-minutes: 2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
      timeout-minutes: 3

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
      timeout-minutes: 2

    - name: Cache uv dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-examples-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-examples-${{ matrix.python-version }}-
          ${{ runner.os }}-uv-
      timeout-minutes: 2

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ build-essential
      timeout-minutes: 5

    - name: Install dependencies
      run: |
        uv venv .venv
        source .venv/bin/activate
        # Install numpy and scipy first to avoid potential conflicts
        uv pip install numpy scipy
        uv pip install -e .[algos]
        # Verify key dependencies
        python -c "import numpy; print(f'numpy {numpy.__version__}')"
        python -c "import scipy; print(f'scipy {scipy.__version__}')"
        python -c "import networkx; print(f'networkx {networkx.__version__}')"
      timeout-minutes: 15

    - name: Run fast examples
      run: |
        echo "🧪 Running fast examples (< 30 seconds each)..."
        source .venv/bin/activate
        python .github/scripts/run_examples.py --fast-only --timeout 30
        echo "✅ Fast examples completed successfully"
      timeout-minutes: 25
      env:
        # Use non-interactive backend for matplotlib
        MPLBACKEND: Agg

    - name: Upload example outputs
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: example-outputs-py${{ matrix.python-version }}
        path: |
          example_images/*.png
          datasets/*.png
        if-no-files-found: warn
        retention-days: 7
      timeout-minutes: 2
