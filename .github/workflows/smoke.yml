name: Smoke Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  smoke-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10  # Smoke test should be fast
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      timeout-minutes: 2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
      timeout-minutes: 3

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~/Library/Caches/pip
          ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-
      timeout-minutes: 2

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ build-essential
      timeout-minutes: 5

    - name: Install py3plex from repository
      shell: bash
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e .
      timeout-minutes: 10

    - name: Run smoke test
      shell: bash
      run: |
        python smoke.py
      timeout-minutes: 5

    - name: Verify SUCCESS output
      shell: bash
      run: |
        # Run smoke test again and capture output
        output=$(python smoke.py 2>&1)
        echo "$output"
        if echo "$output" | grep -q "SUCCESS"; then
          echo "✓ Smoke test passed - SUCCESS message found"
          exit 0
        else
          echo "✗ Smoke test failed - SUCCESS message not found"
          exit 1
        fi
      timeout-minutes: 5
