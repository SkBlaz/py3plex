name: Property-Based Tests

on:
  push:
    branches: [ main, master, develop ]
  # Don't run on PRs to save CI time - property tests are run on main
  # pull_request:
  #   branches: [ main, master, develop ]
  schedule:
    # Run weekly on Mondays at 3 AM UTC for comprehensive coverage
    - cron: '0 3 * * 1'
  workflow_dispatch:  # Allow manual triggering

jobs:
  property-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      timeout-minutes: 2
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
      timeout-minutes: 3
    
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
      timeout-minutes: 2
    
    - name: Cache uv dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-property-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-property-
          ${{ runner.os }}-uv-
      timeout-minutes: 2
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ build-essential
      timeout-minutes: 5
    
    - name: Install test dependencies
      run: |
        uv venv .venv
        source .venv/bin/activate
        uv pip install -e .[tests]
        # Install optional deps for comprehensive tests
        uv pip install python-louvain || echo "⚠️ python-louvain not available"
      timeout-minutes: 10
    
    - name: Run property tests (excluding slow, parallel)
      env:
        HYPOTHESIS_PROFILE: ci
      run: |
        source .venv/bin/activate
        # Run property tests in parallel, skip slow ones
        uv pip install pytest-xdist
        uv run pytest tests/ -m "property and not slow" -n auto --tb=short
      timeout-minutes: 15
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: property-test-results-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          .pytest_cache/
          *.log
        retention-days: 7
  
  property-tests-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Only run slow tests on schedule
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      timeout-minutes: 2
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
      timeout-minutes: 3
    
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
      timeout-minutes: 2
    
    - name: Cache uv dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-property-slow-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-property-
      timeout-minutes: 2
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ build-essential
      timeout-minutes: 5
    
    - name: Install test dependencies
      run: |
        uv venv .venv
        source .venv/bin/activate
        uv pip install -e .[tests]
        uv pip install pytest-xdist python-louvain || echo "⚠️ python-louvain not available"
      timeout-minutes: 10
    
    - name: Run all property tests (including slow, parallel)
      env:
        HYPOTHESIS_PROFILE: nightly
      run: |
        source .venv/bin/activate
        uv run pytest tests/ -m property -n auto --tb=short
      timeout-minutes: 25
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: property-test-results-slow
        path: |
          .pytest_cache/
          *.log
        retention-days: 14
