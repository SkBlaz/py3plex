name: Documentation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      timeout-minutes: 2
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
      timeout-minutes: 3
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade --timeout 120 --retries 5 pip
        # Install Sphinx and extensions
        pip install --timeout 120 --retries 5 sphinx sphinx-rtd-theme myst-parser m2r2
        # Install package dependencies for API documentation
        pip install --timeout 120 --retries 5 numpy scipy networkx matplotlib rdflib tqdm bitarray
        # Install py3plex package itself for autodoc to work
        pip install --timeout 120 --retries 5 -e .
      timeout-minutes: 8
    
    - name: Install LaTeX for PDF generation
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended latexmk
      timeout-minutes: 5
    
    - name: Build Sphinx documentation
      run: |
        cd docfiles
        echo "📚 Building Sphinx documentation..."
        # Build without treating warnings as errors to avoid breaking on autodoc issues
        sphinx-build -b html . _build/ --keep-going
      timeout-minutes: 5
    
    - name: Build PDF documentation
      run: |
        cd docfiles
        echo "📄 Building PDF documentation..."
        # Build PDF using latexpdf builder
        sphinx-build -b latex . _build/latex --keep-going
        cd _build/latex
        # Use latexmk with force flag to complete PDF generation despite minor errors
        # (e.g., Unicode characters that LaTeX can't render but doesn't prevent PDF creation)
        latexmk -pdf -interaction=nonstopmode -f py3plex.tex || true
        # Check if PDF was actually generated
        if [ -f "py3plex.pdf" ] && [ -s "py3plex.pdf" ]; then
          echo "✅ PDF generated successfully ($(stat -f%z py3plex.pdf 2>/dev/null || stat -c%s py3plex.pdf) bytes)"
        else
          echo "❌ PDF generation failed - file not created or empty"
          exit 1
        fi
      timeout-minutes: 10
    
    - name: Copy PDF to docs directory
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      run: |
        echo "📦 Copying PDF to docs directory..."
        mkdir -p docs
        # Verify PDF exists before copying
        if [ ! -f "docfiles/_build/latex/py3plex.pdf" ]; then
          echo "❌ Error: PDF file not found at docfiles/_build/latex/py3plex.pdf"
          exit 1
        fi
        cp docfiles/_build/latex/py3plex.pdf docs/py3plex_documentation.pdf
        ls -lh docs/py3plex_documentation.pdf
        echo "✅ PDF copied successfully"
      timeout-minutes: 1
    
    - name: Commit and push PDF to repository
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add docs/py3plex_documentation.pdf
        # Commit only if there are changes
        if ! git diff --staged --quiet; then
          git commit -m "Update documentation PDF [skip ci]"
          git push
          echo "✅ PDF committed and pushed"
        else
          echo "ℹ️ No changes to PDF, skipping commit"
        fi
      timeout-minutes: 2
    
    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: documentation-html
        path: docfiles/_build/
        retention-days: 30
      timeout-minutes: 2
    
    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: documentation-pdf
        path: docfiles/_build/latex/py3plex.pdf
        retention-days: 30
      timeout-minutes: 2
    
    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docfiles/_build
        force_orphan: true
      timeout-minutes: 3
