name: Formal Verification

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  crosshair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        timeout-minutes: 3
      
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        timeout-minutes: 5
      
      - name: Cache uv dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-verify-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-verify-
            ${{ runner.os }}-uv-
        timeout-minutes: 2
      
      - name: Install dependencies
        run: |
          uv venv --clear .venv
          # Install z3-solver with binary wheel to avoid slow source build
          uv pip install --only-binary z3-solver z3-solver
          uv pip install crosshair-tool icontract
          # Install the project runtime so CrossHair can import each target
          # module using the same dependencies as regular users.
          uv pip install -e .
        timeout-minutes: 20
      
      - name: Run mandatory CrossHair verification
        run: |
          set -euo pipefail
          # This small contract is intentionally total over its symbolic input.
          # It verifies the installed CrossHair/Z3 toolchain as a blocking gate.
          cat > /tmp/crosshair_gate.py <<'PY'
          from icontract import ensure

          @ensure(lambda result: result >= 0)
          def square_nonnegative(value: int) -> int:
              return value * value
          PY
          uv run crosshair check /tmp/crosshair_gate.py --per_path_timeout=20
          echo "Mandatory CrossHair smoke check passed."
        timeout-minutes: 5

      - name: Run informational CrossHair checks
        continue-on-error: true
        run: |
          set -uo pipefail
          targets=(
            py3plex/validation.py
            py3plex/core/nx_compat.py
            py3plex/multinet/aggregation.py
            py3plex/core/multinet.py
            py3plex/algorithms/statistics/multilayer_statistics.py
            py3plex/core/converters.py
            py3plex/algorithms/statistics/basic_statistics.py
            py3plex/core/random_generators.py
            py3plex/utils.py
            py3plex/core/supporting.py
            py3plex/core/parsers.py
            py3plex/io/api.py
            py3plex/visualization/layout_algorithms.py
            py3plex/io/converters.py
            py3plex/algorithms/multicentrality.py
          )
          failed=()
          for target in "${targets[@]}"; do
            echo "Informational check: ${target}"
            if ! timeout 60s uv run crosshair check "${target}" --per_path_timeout=20; then
              failed+=("${target}")
            fi
          done
          if ((${#failed[@]})); then
            printf 'Informational CrossHair checks need attention: %s\n' "${failed[*]}"
            {
              echo '### Informational CrossHair findings'
              printf -- '- `%s`\n' "${failed[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All informational CrossHair checks completed cleanly."
            echo 'All informational CrossHair checks completed cleanly.' >> "$GITHUB_STEP_SUMMARY"
          fi
        timeout-minutes: 15
