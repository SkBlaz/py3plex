name: Type Coverage

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  type-coverage:
    name: Check Type Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      timeout-minutes: 2
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
      timeout-minutes: 3
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mypy lxml types-six
        # Install minimal dependencies for type checking
        pip install numpy scipy networkx matplotlib rdflib tqdm bitarray pandas
      timeout-minutes: 8
    
    - name: Check type coverage
      run: |
        cd docs
        python3 check_type_coverage.py --json ../type-coverage.json --verbose
      timeout-minutes: 5
    
    - name: Display coverage
      run: |
        echo "Type Coverage Results:"
        cat type-coverage.json | python3 -c "import sys, json; data = json.load(sys.stdin); print(f\"Total LOC: {data['total_loc']}\"); print(f\"Precise: {data['precise_loc']} ({data['precise_percent']:.2f}%)\"); print(f\"Imprecise: {data['imprecise_loc']} ({data['imprecise_percent']:.2f}%)\")"
      timeout-minutes: 1
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: type-coverage-report
        path: type-coverage.json
        retention-days: 90
      timeout-minutes: 2
    
    - name: Comment coverage on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const coverage = JSON.parse(fs.readFileSync('type-coverage.json', 'utf8'));
          
          // Find top 10 most imprecise modules
          const topImprecise = coverage.modules
            .filter(m => m.total_loc > 10) // Only modules with >10 LOC
            .sort((a, b) => b.imprecise_percent - a.imprecise_percent)
            .slice(0, 10);
          
          let moduleTable = '';
          topImprecise.forEach((m, i) => {
            const name = m.name.length > 50 ? m.name.substring(0, 47) + '...' : m.name;
            moduleTable += `| ${i + 1} | ${name} | ${m.imprecise_percent.toFixed(1)}% | ${m.total_loc} |\n`;
          });
          
          const comment = `## 🔍 Type Coverage Report
          
          | Metric | Count | Coverage |
          |--------|-------|----------|
          | Total Lines | ${coverage.total_loc.toLocaleString()} | - |
          | Precisely Typed | ${coverage.precise_loc.toLocaleString()} | ${coverage.precise_percent.toFixed(1)}% |
          | Imprecisely Typed | ${coverage.imprecise_loc.toLocaleString()} | ${coverage.imprecise_percent.toFixed(1)}% |
          
          ![Type Coverage](${coverage.badge_url})
          
          ### Top 10 Most Imprecise Modules
          
          | Rank | Module | Imprecision | LOC |
          |------|--------|-------------|-----|
          ${moduleTable}
          
          *Type coverage is measured using mypy's analysis of type annotations. Higher precision means better type coverage.*
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
      timeout-minutes: 2
