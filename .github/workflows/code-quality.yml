name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      timeout-minutes: 2
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.8"
      timeout-minutes: 3
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black ruff isort mypy
        # Install minimal dependencies for type checking
        pip install numpy scipy networkx matplotlib rdflib tqdm bitarray
      timeout-minutes: 8
    
    - name: Run lint checks via Makefile
      run: |
        echo "🔍 Running lint checks via Makefile..."
        make lint
      timeout-minutes: 5
    
    - name: Linting note
      run: |
        echo "✅ Linting complete. Remaining issues should be addressed in future PRs."
