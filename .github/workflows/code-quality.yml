name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      timeout-minutes: 2
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.8"
      timeout-minutes: 3
    
    - name: Install ruff
      run: |
        python -m pip install --upgrade pip
        pip install ruff
      timeout-minutes: 3
    
    - name: Run ruff linting
      run: |
        echo "🔍 Running ruff linter..."
        ruff check py3plex/ --output-format=github || true
      timeout-minutes: 3
      continue-on-error: true
    
    - name: Linting note
      run: |
        echo "ℹ️ Ruff linting is informational only (not blocking)."
        echo "Linting issues are being addressed incrementally as part of the modernization roadmap."

  format:
    name: Check Formatting with Black
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      timeout-minutes: 2
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.8"
      timeout-minutes: 3
    
    - name: Install black
      run: |
        python -m pip install --upgrade pip
        pip install black
      timeout-minutes: 3
    
    - name: Check formatting
      run: |
        echo "🎨 Checking code formatting..."
        black --check --diff py3plex/ || true
      timeout-minutes: 3
      continue-on-error: true
    
    - name: Formatting note
      run: |
        echo "ℹ️ Black formatting check is informational only (not blocking)."
        echo "Code formatting is being addressed incrementally as part of the modernization roadmap."

  type-check:
    name: Type Check with Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      timeout-minutes: 2
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.8"
      timeout-minutes: 3
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mypy
        # Install minimal dependencies for type checking
        pip install numpy scipy networkx matplotlib rdflib tqdm bitarray
      timeout-minutes: 8
    
    - name: Run mypy
      run: |
        echo "🔎 Running mypy type checker..."
        mypy py3plex/ --ignore-missing-imports --no-error-summary || true
      timeout-minutes: 3
      continue-on-error: true
    
    - name: Type checking note
      run: |
        echo "ℹ️ Type checking is informational only (not blocking)."
        echo "Type hints are being added incrementally (currently 2.3% coverage)."
