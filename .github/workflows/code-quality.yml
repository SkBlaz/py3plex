name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      timeout-minutes: 2
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"
      timeout-minutes: 3
    
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
      timeout-minutes: 5
    
    - name: Install dependencies
      run: |
        uv venv .venv
        source .venv/bin/activate
        uv pip install black ruff isort mypy types-six
        # Install minimal dependencies for type checking
        uv pip install numpy scipy networkx matplotlib rdflib tqdm bitarray pandas
      timeout-minutes: 8
    
    - name: Run lint checks via Makefile
      run: |
        echo "🔍 Running lint checks via Makefile..."
        source .venv/bin/activate
        make lint
      timeout-minutes: 5
    
    - name: Linting note
      run: |
        echo "✅ Linting complete. Remaining issues should be addressed in future PRs."
