name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      timeout-minutes: 2
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"
      timeout-minutes: 3
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade --timeout 120 --retries 5 pip
        pip install --timeout 120 --retries 5 black ruff isort mypy types-six
        # Install minimal dependencies for type checking
        pip install --timeout 120 --retries 5 numpy scipy networkx matplotlib rdflib tqdm bitarray pandas
      timeout-minutes: 8
    
    - name: Run lint checks via Makefile
      run: |
        echo "🔍 Running lint checks via Makefile..."
        make lint
      timeout-minutes: 5
    
    - name: Linting note
      run: |
        echo "✅ Linting complete. Remaining issues should be addressed in future PRs."
