name: Fuzzing

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # Fast property-based tests run on every commit/PR
  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        timeout-minutes: 3
      
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        timeout-minutes: 2
      
      - name: Install dependencies
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install pytest hypothesis
          uv pip install networkx numpy scipy tqdm || true
          uv pip install -e . || true
        timeout-minutes: 8
      
      - name: Run property-based fuzzing tests
        run: |
          source .venv/bin/activate
          uv run pytest tests/test_fuzzing_properties.py -v --tb=short
        continue-on-error: false
        timeout-minutes: 5
      
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-failures
          path: .hypothesis/
          retention-days: 7
        timeout-minutes: 2
