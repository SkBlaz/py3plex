name: Lines of Code

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  count-loc:
    name: Count Lines of Code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      timeout-minutes: 2
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
      timeout-minutes: 2
    
    - name: Count lines of code
      run: |
        python3 .github/scripts/count_loc.py --root py3plex --json loc-stats.json
      timeout-minutes: 1
    
    - name: Display LOC statistics
      run: |
        echo "Lines of Code Statistics:"
        cat loc-stats.json | python3 -m json.tool
      timeout-minutes: 1
    
    - name: Upload LOC report
      uses: actions/upload-artifact@v4
      with:
        name: loc-report
        path: loc-stats.json
        retention-days: 90
      timeout-minutes: 2
    
    - name: Generate badge values
      run: |
        TOTAL_LINES=$(cat loc-stats.json | python3 -c "import sys, json; print(json.load(sys.stdin)['total_lines'])")
        FORMATTED_LINES=$(cat loc-stats.json | python3 -c "import sys, json; print(json.load(sys.stdin)['total_lines_formatted'])")
        CODE_LINES=$(cat loc-stats.json | python3 -c "import sys, json; print(json.load(sys.stdin)['code_lines'])")
        echo "TOTAL_LINES=$TOTAL_LINES" >> $GITHUB_ENV
        echo "FORMATTED_LINES=$FORMATTED_LINES" >> $GITHUB_ENV
        echo "CODE_LINES=$CODE_LINES" >> $GITHUB_ENV
        echo "Total lines: $FORMATTED_LINES ($TOTAL_LINES)"
        echo "Code lines: $CODE_LINES"
      timeout-minutes: 1
    
    - name: Comment LOC on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const stats = JSON.parse(fs.readFileSync('loc-stats.json', 'utf8'));
          
          const comment = `## 📊 Lines of Code Report
          
          | Metric | Count |
          |--------|-------|
          | **Total Lines** | **${stats.total_lines.toLocaleString()}** |
          | Code Lines | ${stats.code_lines.toLocaleString()} |
          | Comment Lines | ${stats.comment_lines.toLocaleString()} |
          | Blank Lines | ${stats.blank_lines.toLocaleString()} |
          | Files | ${stats.total_files} |
          
          ![Lines of Code](https://img.shields.io/badge/lines-${stats.total_lines_formatted}-blue)
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
      timeout-minutes: 2
